<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한채 · 이메일 인증</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&family=Noto+Serif+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/hanchae.css">
  <link rel="stylesheet" href="css/pages/login.css">
</head>
<body>
  <header class="hc-header">
    <div class="hc-header-inner">
      <a class="hc-logo" href="/">한채</a>
    </div>
  </header>
  <div class="giwa" aria-hidden="true"></div>
  <div class="dancheong-band" aria-hidden="true"></div>

  <main class="login">
    <section class="login-card card" aria-labelledby="verify-title" aria-live="polite">
      <h1 id="verify-title" class="login-title">이메일 인증 마치기</h1>
      <p class="login-desc" id="verify-text">가입할 때 정한 비밀번호를 넣으면 인증을 마치고 바로 들어가요.</p>
      <form id="verify-form" class="login-form" novalidate>
        <div class="field">
          <label for="verify-password">비밀번호</label>
          <input id="verify-password" type="password" name="password" autocomplete="current-password" required>
        </div>
        <p class="form-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block form-submit">인증 마치기</button>
        <p class="login-switch">비밀번호가 기억나지 않나요? <a class="text-link" href="/login?forgot=1">비밀번호 새로 정하기</a></p>
      </form>
      <a class="btn btn-primary btn-block" id="verify-link" href="/login" hidden>로그인하러 가기</a>
    </section>
  </main>

  <footer class="hc-footer">
    <div class="dancheong-band" aria-hidden="true"></div>
    <div class="hc-footer-inner">
      <span class="hc-footer-logo">한채</span>
      <span class="hc-footer-sub">한 사람, 한 채, 그 안의 기록</span>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/verify-email.js"></script>
</body>
</html>
