<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한채 · 마을</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&family=Noto+Serif+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/hanchae.css">
  <link rel="stylesheet" href="css/pages/village.css">
</head>
<body>
  <header class="hc-header">
    <div class="hc-header-inner">
      <a class="hc-logo" href="/">한채</a>
      <form class="hc-search" id="village-search" role="search">
        <label for="village-q" class="sr-only">마을에서 찾기</label>
        <input id="village-q" name="q" type="search" maxlength="50" placeholder="마을에서 기록과 한채 찾기">
        <button type="submit" aria-label="찾기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        </button>
      </form>
      <a class="hc-release" href="/releases">릴리즈</a>
      <nav class="hc-nav" id="header-nav" aria-label="내 메뉴">
        <a class="btn btn-secondary" href="/login">로그인</a>
      </nav>
    </div>
  </header>
  <div class="giwa" aria-hidden="true"></div>
  <div class="dancheong-band" aria-hidden="true"></div>

  <div class="village">
    <!-- 탈퇴(/?left=1) · 한채 허물기(/?demolished=1) 뒤 돌아왔을 때 (village.js) -->
    <p class="left-notice" id="left-notice" role="status" hidden>
      <span id="left-notice-text"></span>
      <button type="button" class="left-notice-close" id="left-notice-close" aria-label="안내 닫기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </p>
    <main class="village-main">
      <!-- 어귀 -->
      <section class="entry card" aria-labelledby="entry-title">
        <div class="entry-text">
          <div class="entry-heading">
            <h1 id="entry-title" class="entry-title">한 사람, 한 채,<br>그 안의 기록</h1>
            <span class="entry-seal" aria-hidden="true">한채</span>
          </div>
          <p class="entry-desc">나만의 집을 짓고 기록을 쌓아 보세요. 마을을 거닐다 마음에 드는 한채와 이웃이 될 수 있어요.</p>
          <div class="entry-actions">
            <a class="btn btn-primary" href="/build">한채 짓기</a>
            <a class="text-link" href="#fresh">마을 둘러보기</a>
          </div>
        </div>
        <!-- 마을 지붕선: 뒷줄은 옅은 회색, 앞줄은 기와 지붕 · 흰 벽 · 나무 기둥. 좁은 화면에서는 가운데만 보인다 -->
        <svg class="entry-village" viewBox="0 50 760 100" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
          <g fill="#b9bdc2">
            <path d="M5,110 Q17,104.9 32,98.1 L42.5,76 L117.5,76 L128,98.1 Q143,104.9 155,110 Z"/>
            <path d="M245,110 Q258.6,104.9 275.6,98.1 L287.5,76 L372.5,76 L384.4,98.1 Q401.4,104.9 415,110 Z"/>
            <path d="M530,110 Q542.8,104.9 558.8,98.1 L570,76 L650,76 L661.2,98.1 Q677.2,104.9 690,110 Z"/>
          </g>
          <g fill="#fcfcfa" stroke="#d6d6d0">
            <rect x="25" y="110" width="110" height="40"/>
            <rect x="265" y="110" width="130" height="40"/>
            <rect x="550" y="110" width="120" height="40"/>
          </g>
          <g fill="#fcfcfa">
            <rect x="115" y="132" width="170" height="18"/>
            <rect x="375" y="132" width="190" height="18"/>
            <rect x="630" y="132" width="140" height="18"/>
          </g>
          <g fill="#5a2a1f">
            <rect x="115" y="132" width="4" height="18"/>
            <rect x="198" y="132" width="4" height="18"/>
            <rect x="281" y="132" width="4" height="18"/>
            <rect x="375" y="132" width="4" height="18"/>
            <rect x="468" y="132" width="4" height="18"/>
            <rect x="561" y="132" width="4" height="18"/>
            <rect x="630" y="132" width="4" height="18"/>
            <rect x="698" y="132" width="4" height="18"/>
          </g>
          <g fill="#3b4552">
            <path d="M95,132 Q111.8,125.4 132.8,116.6 L147.5,88 L252.5,88 L267.2,116.6 Q288.2,125.4 305,132 Z"/>
            <path d="M355,132 Q373.4,125.4 396.4,116.6 L412.5,88 L527.5,88 L543.6,116.6 Q566.6,125.4 585,132 Z"/>
            <path d="M610,132 Q624.4,125.4 642.4,116.6 L655,88 L745,88 L757.6,116.6 Q775.6,125.4 790,132 Z"/>
          </g>
          <g stroke="#2a313a" stroke-width="5" stroke-linecap="round">
            <line x1="147.5" y1="88" x2="252.5" y2="88"/>
            <line x1="412.5" y1="88" x2="527.5" y2="88"/>
            <line x1="655" y1="88" x2="745" y2="88"/>
          </g>
        </svg>
        <div class="dancheong-band" aria-hidden="true"></div>
      </section>

      <!-- 골목 -->
      <section class="section" aria-labelledby="alley-title">
        <div class="section-head">
          <h2 id="alley-title">골목</h2>
          <span class="sub">관심 있는 골목을 골라 보세요</span>
          <a class="more text-link" id="alley-more" href="#">이 골목 더 보기</a>
        </div>
        <div class="topic-list" id="topic-list" aria-label="골목 고르기"></div>
        <div class="alley-posts" id="alley-posts" aria-live="polite">
          <p class="empty">이 골목에는 아직 기록이 없어요.</p>
        </div>
      </section>

      <!-- 이웃 소식: 로그인했을 때만 -->
      <section class="neighbors" id="neighbors" aria-labelledby="neighbors-title" hidden>
        <div class="section-head">
          <h2 id="neighbors-title">이웃 소식</h2>
          <span class="sub">이웃 한채에 새로 쌓인 기록</span>
          <a class="more text-link" href="/neighbors">이웃 소식 전체</a>
        </div>
        <div class="neighbor-posts" id="neighbor-posts"></div>
      </section>

      <!-- 새 기록 -->
      <section class="section fresh" id="fresh" aria-labelledby="fresh-title">
        <div class="section-head">
          <h2 id="fresh-title">새 기록</h2>
          <span class="sub">마을에 방금 쌓인 기록</span>
        </div>
        <div id="fresh-posts"></div>
      </section>
    </main>

    <aside class="village-side" aria-label="마을 소식">
      <!-- 내 자리: 로그인 상태에 따라 village.js 가 채운다 -->
      <section class="seat card" aria-label="내 자리">
        <div class="giwa giwa-thin" aria-hidden="true"></div>
        <div class="dancheong-band" aria-hidden="true"></div>
        <div class="seat-body" id="seat"></div>
      </section>

      <section class="side-box card" aria-labelledby="rank-title">
        <div class="section-head">
          <h2 id="rank-title">지금 많이 읽는 기록</h2>
          <span class="sub rank-basis" id="rank-basis"></span>
        </div>
        <ol class="rank-list" id="rank-list"></ol>
      </section>

      <section class="side-box card" aria-labelledby="house-title">
        <div class="section-head">
          <h2 id="house-title">북적이는 한채</h2>
          <span class="sub rank-basis" id="house-basis"></span>
        </div>
        <div class="house-list" id="house-list"></div>
      </section>
    </aside>
  </div>

  <footer class="hc-footer">
    <div class="dancheong-band" aria-hidden="true"></div>
    <div class="hc-footer-inner">
      <span class="hc-footer-logo">한채</span>
      <span class="hc-footer-sub">한 사람, 한 채, 그 안의 기록</span>
      <span class="hc-footer-sub hc-footer-links"><a href="/terms">이용약관</a> · <a href="/privacy">개인정보처리방침</a></span>
    </div>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/village.js"></script>
</body>
</html>
