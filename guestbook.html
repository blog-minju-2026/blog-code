<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한채 · 방명록</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&family=Noto+Serif+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/hanchae.css">
  <link rel="stylesheet" href="css/pages/guestbook.css">
</head>
<body>
  <header class="hc-header">
    <div class="hc-header-inner">
      <a class="hc-logo" href="/">한채</a>
      <form class="hc-search" id="village-search" role="search">
        <label for="village-q" class="sr-only">마을에서 찾기</label>
        <input id="village-q" name="q" type="search" maxlength="50" placeholder="마을에서 기록과 한채 찾기">
        <button type="submit" aria-label="찾기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        </button>
      </form>
      <a class="hc-release" href="/releases">릴리즈</a>
      <nav class="hc-nav" id="header-nav" aria-label="내 메뉴"></nav>
    </div>
  </header>
  <section class="gate guest-gate" id="gate" aria-label="대문" hidden>
    <div class="giwa yard-giwa" aria-hidden="true"></div>
    <div class="dancheong-band" aria-hidden="true"></div>
    <div class="gate-inner guest-gate-inner">
      <a class="hyeonpan hyeonpan-lg" id="blog-name"></a>
      <div class="gate-actions" id="gate-actions"></div>
    </div>
  </section>

  <div class="house guest-house" id="house" hidden>
    <nav class="breadcrumb" id="breadcrumb" aria-label="현재 위치"></nav>

    <div class="house-cols">
      <main class="house-main guest-main">
        <div class="section-head">
          <h1>방명록</h1>
          <span class="sub" id="guest-count"></span>
        </div>

        <form class="card guest-form" id="guest-form" novalidate hidden>
          <label for="guest-text">한마디 남기기</label>
          <textarea id="guest-text" class="textarea" rows="3" maxlength="1000" placeholder="다녀간 흔적을 남겨 주세요"></textarea>
          <div class="guest-form-foot">
            <span class="field-hint" id="guest-len">0 / 1,000</span>
            <p class="form-error-line" id="guest-error" role="alert"></p>
            <button type="submit" class="btn btn-primary" id="guest-submit">남기기</button>
          </div>
        </form>
        <div class="card guest-login" id="guest-login" hidden>
          <strong>로그인하면 방명록을 남길 수 있어요</strong>
          <a class="btn btn-primary" id="guest-login-link">로그인</a>
        </div>

        <ol class="guest-list" id="guest-list" aria-live="polite"></ol>
        <nav class="pager" id="pager" aria-label="페이지"></nav>
      </main>

      <aside class="house-side">
        <p class="guest-rule">수정은 쓴 사람만, 삭제는 쓴 사람과 이 한채의 주인이 할 수 있어요.</p>
      </aside>
    </div>
  </div>

  <footer class="hc-footer">
    <div class="dancheong-band" aria-hidden="true"></div>
    <div class="hc-footer-inner">
      <span class="hc-footer-logo">한채</span>
      <span class="hc-footer-sub">한 사람, 한 채, 그 안의 기록</span>
    </div>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/guestbook.js"></script>
</body>
</html>
