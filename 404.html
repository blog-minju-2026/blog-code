<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>찾는 집이 없어요 · 한채</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&family=Noto+Serif+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/hanchae.css">
</head>
<body>
  <header class="hc-header">
    <div class="hc-header-inner">
      <a class="hc-logo" href="/">한채</a>
      <form class="hc-search" id="village-search" role="search">
        <label for="village-q" class="sr-only">마을에서 찾기</label>
        <input id="village-q" name="q" type="search" maxlength="50" placeholder="마을에서 기록과 한채 찾기">
        <button type="submit" aria-label="찾기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        </button>
      </form>
      <a class="hc-release" href="/releases">릴리즈</a>
      <nav class="hc-nav" id="header-nav" aria-label="내 메뉴"></nav>
    </div>
  </header>
  <div class="giwa" aria-hidden="true"></div>
  <div class="dancheong-band" aria-hidden="true"></div>

  <!-- 닫힌 대문 (SCR-20). 같은 모양을 다른 화면에서는 js/common.js 의 lostHTML 이 그린다 -->
  <main class="lost">
    <div class="lost-gate" aria-hidden="true">
      <div class="lost-roof"><i class="lost-roof-peak"></i><i class="lost-roof-eaves"></i><i class="lost-roof-tip lost-roof-tip-l"></i><i class="lost-roof-tip lost-roof-tip-r"></i></div>
      <div class="dancheong-band"></div>
      <div class="lost-frame">
        <span class="hyeonpan lost-code">404</span>
        <div class="lost-doors"><span><i class="lost-ring"></i></span><span><i class="lost-ring"></i></span></div>
      </div>
      <div class="lost-step"></div>
    </div>
    <div class="lost-text">
      <span class="lost-eyebrow">없는 주소</span>
      <h1>찾는 집이 없어요</h1>
      <p>주소가 바뀌었거나 허물어진 한채, 지워진 기록이에요. 마을에서 다시 찾아 보세요.</p>
      <div class="lost-actions">
        <a class="btn btn-primary" href="/">마을로 돌아가기</a>
        <button type="button" class="btn btn-secondary" data-lost="back">이전 화면으로</button>
      </div>
    </div>
  </main>

  <footer class="hc-footer">
    <div class="dancheong-band" aria-hidden="true"></div>
    <div class="hc-footer-inner">
      <span class="hc-footer-logo">한채</span>
      <span class="hc-footer-sub">한 사람, 한 채, 그 안의 기록</span>
    </div>
  </footer>

  <script src="/js/content.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/pages/lost.js"></script>
</body>
</html>
