<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한채 · 기록</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&family=Noto+Serif+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/hanchae.css">
  <link rel="stylesheet" href="css/content.css">
  <link rel="stylesheet" href="css/pages/post.css">
</head>
<body>
  <header class="hc-header">
    <div class="hc-header-inner">
      <a class="hc-logo" href="/">한채</a>
      <form class="hc-search" id="village-search" role="search">
        <label for="village-q" class="sr-only">마을에서 찾기</label>
        <input id="village-q" name="q" type="search" placeholder="마을에서 기록과 한채 찾기">
        <button type="submit" aria-label="찾기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        </button>
      </form>
      <a class="hc-release" href="/releases">릴리즈</a>
      <nav class="hc-nav" id="header-nav" aria-label="내 메뉴"></nav>
    </div>
  </header>

  <!-- 작은 대문 -->
  <section class="gate" id="gate" aria-label="대문" hidden>
    <div class="giwa" aria-hidden="true"></div>
    <div class="dancheong-band" aria-hidden="true"></div>
    <div class="gate-inner">
      <a class="hyeonpan" id="blog-link"></a>
      <span class="post-gate-meta" id="gate-meta"></span>
      <div class="gate-actions" id="gate-actions"></div>
    </div>
  </section>

  <div class="house" id="house" hidden>
    <nav class="breadcrumb" id="breadcrumb" aria-label="현재 위치"></nav>

    <div class="house-cols">
      <main class="house-main">
        <article class="post card">
          <header class="scroll">
            <div class="scroll-rod" aria-hidden="true"></div>
            <a class="scroll-room" id="room-link"></a>
            <h1 class="scroll-title" id="post-title"></h1>
            <span class="scroll-meta" id="post-meta"></span>
            <div class="scroll-rod" aria-hidden="true"></div>
          </header>

          <p class="hidden-notice" id="hidden-notice" role="status" hidden></p>
          <div class="post-body post-content" id="post-body"></div>

          <div class="post-tags tag-list" id="post-tags"></div>

          <!-- 낙관: 주인 서명 -->
          <div class="post-sign">
            <span class="post-sign-label">이 집 주인</span>
            <span class="post-sign-name" id="owner-name"></span>
            <span class="nakgwan" id="nakgwan" role="img"></span>
          </div>

          <div class="post-actions">
            <button type="button" class="btn like-button" id="like-button" aria-pressed="false">
              <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
              <span id="like-label">공감 0</span>
            </button>
            <button type="button" class="btn btn-secondary" id="copy-button">주소 복사</button>
            <span class="post-owner-tools" id="owner-tools" hidden>
              <a class="text-link" id="edit-link">수정</a>
              <button type="button" class="text-link post-delete" id="delete-button">삭제</button>
            </span>
          </div>
        </article>

        <nav class="post-nav" id="post-nav" aria-label="이전 · 다음 기록"></nav>

        <section class="comments card" aria-labelledby="comments-title">
          <h2 id="comments-title">댓글 0</h2>
          <ul class="comment-list" id="comment-list"></ul>
          <form class="comment-form" id="comment-form">
            <label for="comment-text" class="sr-only">댓글 쓰기</label>
            <textarea id="comment-text" class="textarea" rows="3" maxlength="1000" placeholder="이 기록에 댓글을 남겨 보세요"></textarea>
            <div class="comment-form-foot">
              <span class="comment-count" id="comment-count">0 / 1,000</span>
              <button type="submit" class="btn btn-primary">등록</button>
            </div>
          </form>
        </section>
      </main>

      <aside class="house-side post-side" aria-label="방 안내">
        <nav class="room-guide" aria-labelledby="room-guide-title">
          <h2 id="room-guide-title">방 안내</h2>
          <ul id="room-list"></ul>
        </nav>
        <section class="card same-room" id="same-room" aria-labelledby="same-room-title" hidden>
          <h2 id="same-room-title"></h2>
          <ul id="same-room-list"></ul>
        </section>
      </aside>
    </div>
  </div>


  <footer class="hc-footer">
    <div class="dancheong-band" aria-hidden="true"></div>
    <div class="hc-footer-inner">
      <span class="hc-footer-logo">한채</span>
      <span class="hc-footer-sub">한 사람, 한 채, 그 안의 기록</span>
    </div>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/post.js"></script>
</body>
</html>
