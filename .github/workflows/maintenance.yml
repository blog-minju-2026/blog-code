# 한채 백업 · 정리 (하루 한 번). 백업은 2026-12-23(개인정보 처리방침 시행일)부터 한다
# 1) 서버에서 ~/hanchae/backup.sh 를 부른다: DB 를 통째로 뜨고 사진을 ~/hanchae-backups 로 복사한다 (deploy/backup.sh).
# 2) 서버의 1번 컨테이너 안에서 python manage.py run_maintenance 를 부른다.
#    쓰이지 않는 사진 · 인증 안 마친 가입 · 끝난 세션 · 오래된 조회 기록을 지운다 (backend/apps/posts/management/commands/run_maintenance.py).
# 백업을 먼저 한다. 정리가 잘못 지워도 그날 아침 모습이 남는다. 백업이 실패하면 정리하지 않는다.
# 학교 서버에는 cron 을 두지 않으므로 배포에 쓰는 SSH Secret 으로 GitHub 이 대신 부른다.
# 손으로 부르려면 Actions → maintenance → Run workflow (dry_run 을 켜면 백업도 삭제도 하지 않고 수만 본다).
name: maintenance

on:
  schedule:
    - cron: "0 19 * * *" # 매일 새벽 4시 (한국 시간). GitHub 사정으로 조금 늦게 돌 수 있다
  workflow_dispatch:
    inputs:
      dry_run:
        description: "지우지 않고 수만 보기"
        type: boolean
        default: false

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      # 백업에는 지운 정보가 최대 14일 남는다. 개인정보 처리방침에 그 내용을 더했고, 그 시행일부터 백업한다
      # (privacy.html 11장의 시행일과 같은 날이어야 한다. 그 전에는 서버에서 손으로도 backup.sh 를 돌리지 않는다)
      - name: 백업을 시작한 날인지 보기
        id: backup
        env:
          BACKUP_FROM: "2026-12-23"
        run: |
          today="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          if [[ "$today" < "$BACKUP_FROM" ]]; then
            echo "백업은 $BACKUP_FROM 부터 해요 (개인정보 처리방침 시행일). 오늘은 정리만 해요."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 서버에서 백업하기
        if: ${{ !inputs.dry_run && steps.backup.outputs.run == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: bash ~/hanchae/backup.sh

      - name: 서버에서 정리하기
        uses: appleboy/ssh-action@v1.0.3
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          envs: DRY_RUN
          script: docker exec hanchae-backend-1 python manage.py run_maintenance $DRY_RUN
