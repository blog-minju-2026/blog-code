# 한채 배포 (서버 배포 설명서 4단계)
# main 에 백엔드 · 화면 · 배포 파일이 바뀌어 올라오면 테스트를 돌리고, 통과하면 Docker 이미지를 만들어 서버로 보내고, SSH 로 접속해 실행한다.
# 필요한 값은 모두 GitHub 저장소 Settings → Secrets and variables → Actions → Repository secrets 에 넣는다 (deploy/README.md).
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "*.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/test.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # 테스트가 통과해야 서버로 보낸다 (.github/workflows/test.yml)
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker 이미지 만들기
        run: docker build -t hanchae-backend:latest .

      - name: 이미지를 파일로 저장
        run: |
          mkdir -p bundle
          docker save hanchae-backend:latest | gzip > bundle/hanchae-backend.tar.gz
          cp deploy/deploy.sh deploy/backup.sh bundle/

      - name: 서버에서 쓸 환경 변수 파일 만들기
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          HANCHAE_DOMAIN: ${{ secrets.HANCHAE_DOMAIN }}
          USE_HTTPS: ${{ secrets.USE_HTTPS }}
          APP_PORT: ${{ secrets.APP_PORT }}
          APP_PORT_2: ${{ secrets.APP_PORT_2 }}
          # 컨테이너가 받는 주소. 비워 두면 0.0.0.0 (deploy.sh). 학교 서버에서는 비워 둔다
          BIND_HOST: ${{ secrets.BIND_HOST }}
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          # 설명서는 DB_USERNAME, 처음 만든 이름은 DB_USER. 어느 쪽으로 넣어도 된다
          DB_USER: ${{ secrets.DB_USER || secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          # 서버 오류(500)를 메일로 받을 주소. 쉼표로 여럿. 비워 두면 EMAIL_HOST_USER 로 간다
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          # 소셜 로그인: 앱 키를 넣은 제공사만 켜진다 (비워 두면 그 버튼이 보이지 않는다)
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_SECRET: ${{ secrets.KAKAO_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
        run: |
          {
            printf 'DJANGO_SECRET_KEY=%s\n' "$DJANGO_SECRET_KEY"
            printf 'DJANGO_DEBUG=0\n'
            printf 'HANCHAE_DOMAIN=%s\n' "$HANCHAE_DOMAIN"
            printf 'USE_HTTPS=%s\n' "${USE_HTTPS:-0}"
            printf 'APP_PORT=%s\n' "$APP_PORT"
            printf 'APP_PORT_2=%s\n' "$APP_PORT_2"
            printf 'BIND_HOST=%s\n' "$BIND_HOST"
            printf 'DB_ADDRESS=%s\n' "$DB_ADDRESS"
            printf 'DB_PORT=%s\n' "$DB_PORT"
            printf 'DB_NAME=%s\n' "$DB_NAME"
            printf 'DB_USER=%s\n' "$DB_USER"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'EMAIL_HOST_USER=%s\n' "$EMAIL_HOST_USER"
            printf 'EMAIL_HOST_PASSWORD=%s\n' "$EMAIL_HOST_PASSWORD"
            printf 'ADMIN_EMAILS=%s\n' "$ADMIN_EMAILS"
            for name in KAKAO_CLIENT_ID KAKAO_SECRET GOOGLE_CLIENT_ID GOOGLE_SECRET NAVER_CLIENT_ID NAVER_SECRET; do
              printf '%s=%s\n' "$name" "${!name}"
            done
            printf 'SERVE_MEDIA=1\n'
            printf 'MEDIA_ROOT=/app/media\n'
          } > bundle/hanchae.env
          for name in DJANGO_SECRET_KEY HANCHAE_DOMAIN APP_PORT APP_PORT_2 DB_ADDRESS DB_PORT DB_NAME DB_USER DB_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name 이 비어 있어요"; exit 1; fi
          done
          if [ -z "$EMAIL_HOST_USER" ] || [ -z "$EMAIL_HOST_PASSWORD" ]; then
            echo "::warning::EMAIL_HOST_USER · EMAIL_HOST_PASSWORD 가 비어 있어 인증 메일이 나가지 않아요. 가입한 사람이 로그인할 수 없어요"
          fi

      - name: 서버로 보내기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "bundle/*"
          target: "~/hanchae"
          strip_components: 1

      - name: 서버에서 실행하기
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: bash ~/hanchae/deploy.sh

      # deploy.sh 는 서버 안에서 127.0.0.1:포트 로만 확인한다. nginx 를 거쳐 실제 주소로도 열리는지 밖에서 한 번 더 본다.
      # (서버 안의 확인은 통과했는데 사이트는 502 였던 적이 있다. 그때 배포는 성공으로 표시됐다)
      - name: 사이트가 밖에서 열리는지 확인
        env:
          HANCHAE_DOMAIN: ${{ secrets.HANCHAE_DOMAIN }}
          USE_HTTPS: ${{ secrets.USE_HTTPS }}
        run: |
          scheme=http
          if [ "${USE_HTTPS:-0}" = "1" ]; then scheme=https; fi
          for path in / /api/topics; do
            code=000
            for i in $(seq 1 10); do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$scheme://$HANCHAE_DOMAIN$path" || true)"
              if [ "$code" = "200" ]; then break; fi
              sleep 3
            done
            if [ "$code" != "200" ]; then
              echo "::error::배포는 끝났지만 사이트의 $path 가 밖에서 $code 로 답해요. deploy/README.md 의 '502 가 뜰 때' 를 보세요"
              exit 1
            fi
            echo "$path → 200"
          done
