<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한채 · 새 비밀번호</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&family=Noto+Serif+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/hanchae.css">
  <link rel="stylesheet" href="css/pages/login.css">
</head>
<body>
  <header class="hc-header">
    <div class="hc-header-inner">
      <a class="hc-logo" href="/">한채</a>
    </div>
  </header>
  <div class="giwa" aria-hidden="true"></div>
  <div class="dancheong-band" aria-hidden="true"></div>

  <main class="login">
    <section class="login-card card" aria-labelledby="reset-title" aria-live="polite">
      <h1 id="reset-title" class="login-title">새 비밀번호 정하기</h1>
      <p class="login-desc" id="reset-text">앞으로 로그인할 때 쓸 비밀번호를 정해 주세요. 이메일 인증을 마치지 않았다면 인증도 함께 마쳐져요.</p>
      <form id="reset-form" class="login-form" novalidate>
        <div class="field">
          <label for="reset-password">새 비밀번호 <span class="hint">8자 이상</span></label>
          <input id="reset-password" type="password" name="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="field">
          <label for="reset-password-confirm">새 비밀번호 확인</label>
          <input id="reset-password-confirm" type="password" name="passwordConfirm" autocomplete="new-password" required>
        </div>
        <p class="form-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block form-submit">비밀번호 정하기</button>
      </form>
      <a class="btn btn-primary btn-block" id="reset-again" href="/login?forgot=1" hidden>링크 다시 받기</a>
    </section>
  </main>

  <footer class="hc-footer">
    <div class="dancheong-band" aria-hidden="true"></div>
    <div class="hc-footer-inner">
      <span class="hc-footer-logo">한채</span>
      <span class="hc-footer-sub">한 사람, 한 채, 그 안의 기록</span>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages/reset-password.js"></script>
</body>
</html>
