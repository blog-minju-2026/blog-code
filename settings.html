<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한채 · 한채 관리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gugi&family=Noto+Serif+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/hanchae.css">
  <link rel="stylesheet" href="css/pages/settings.css">
</head>
<body>
  <header class="hc-header">
    <div class="hc-header-inner">
      <a class="hc-logo" href="/">한채</a>
      <form class="hc-search" id="village-search" role="search">
        <label for="village-q" class="sr-only">마을에서 찾기</label>
        <input id="village-q" name="q" type="search" maxlength="50" placeholder="마을에서 기록과 한채 찾기">
        <button type="submit" aria-label="찾기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        </button>
      </form>
      <a class="hc-release" href="/releases">릴리즈</a>
      <nav class="hc-nav" id="header-nav" aria-label="내 메뉴"></nav>
    </div>
  </header>

  <section class="gate" id="gate" aria-label="대문" hidden></section>

  <div class="house" id="house" hidden>
    <nav class="breadcrumb" id="breadcrumb" aria-label="현재 위치"></nav>
    <nav class="tabs" id="tabs" aria-label="한채 관리 메뉴"></nav>

    <div class="house-cols">
      <main class="house-main">
        <form class="form-card card" id="settings-form" novalidate>
          <div class="form-card-head">
            <h1>한채 관리</h1>
            <p>대문에 걸리는 현판과 주인 소개를 바꿀 수 있어요.</p>
          </div>

          <!-- 사진은 하나: 내 정보의 프로필 사진이 대문에 걸린다 -->
          <div class="owner-photo-note">
            <span id="owner-photo"></span>
            <div>
              <span class="field-label">주인 사진</span>
              <span class="field-hint">대문에는 내 정보의 프로필 사진이 그대로 걸려요.</span>
            </div>
            <a class="text-link" href="/me">내 정보에서 바꾸기</a>
          </div>

          <div class="field-group">
            <label for="blog-name-input">한채 이름 (현판)</label>
            <input id="blog-name-input" class="input" type="text" maxlength="40" autocomplete="off">
            <span class="field-hint field-count" id="name-count">0 / 40</span>
          </div>

          <div class="field-group">
            <label for="blog-intro-input">주인 소개 <span class="optional">(선택)</span></label>
            <textarea id="blog-intro-input" class="textarea" rows="3" maxlength="200"></textarea>
            <span class="field-hint field-count" id="intro-count">0 / 200</span>
          </div>

          <p class="form-error-line" id="form-error" role="alert"></p>
          <div class="form-actions">
            <span class="saved-mark" id="saved" role="status" hidden>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>저장했어요
            </span>
            <div class="btns">
              <a class="btn btn-secondary" id="cancel-link">취소</a>
              <button type="submit" class="btn btn-primary" id="save-button">저장</button>
            </div>
          </div>
        </form>

        <section class="later-box" aria-labelledby="demolish-title">
          <div>
            <h2 id="demolish-title">한채 허물기 <small>2차</small></h2>
            <span>한채를 삭제하면 기록 · 댓글 · 방명록이 모두 사라지고, 주소는 다시 쓸 수 없어요.</span>
          </div>
          <button type="button" class="btn btn-danger-outline" disabled>한채 삭제</button>
        </section>
      </main>

      <aside class="house-side settings-side" aria-labelledby="preview-title">
        <div class="preview-head">
          <h2 id="preview-title">대문 미리보기</h2>
          <span>저장하면 이렇게 보여요</span>
        </div>
        <div class="preview-gate card">
          <div class="giwa preview-giwa" aria-hidden="true"></div>
          <div class="dancheong-band" aria-hidden="true"></div>
          <div class="preview-body">
            <div class="hyeonpan hyeonpan-lg preview-name" id="preview-name"></div>
            <div class="preview-owner">
              <span id="preview-photo"></span>
              <span><span id="preview-nickname"></span><br><span id="preview-intro"></span></span>
            </div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <footer class="hc-footer">
    <div class="dancheong-band" aria-hidden="true"></div>
    <div class="hc-footer-inner">
      <span class="hc-footer-logo">한채</span>
      <span class="hc-footer-sub">한 사람, 한 채, 그 안의 기록</span>
    </div>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/settings.js"></script>
</body>
</html>
